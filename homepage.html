<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebRate</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Logo -->
  <div class="logo">
    <span>WebRate</span>
  </div>

  <!-- History button -->
  <button class="history-button">
    View History
    <span>▼</span>
  </button>

  <!-- Main form -->
  <div class="form">

    <input
            type="text"
            placeholder="URL"
    >

    <input
            type="text"
            placeholder="Bedrijf"
    >

    <input
            type="text"
            placeholder="Plaats"
    >

    <button class="scan-button">
      Scan
    </button>

  </div>

  <!-- Information button -->
  <button class="info-button">
    i
  </button>

</div>

</body>
</html>
